# Dependabot version updates — https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Python dependencies (uv reads pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait before proposing brand-new releases (supply-chain hardening).
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
