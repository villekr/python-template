[project]
name = "python-template"
version = "0.1.0"
description = "Python project template with modern defaults: uv, ruff, ty, pytest, pip-audit, gitleaks, zizmor, pre-commit, GitHub Actions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    # ty is beta (0.0.x); pin an upper bound so a breaking pre-1.0 release
    # can't silently land via `uv sync`. Bump deliberately.
    "ty>=0.0.82,<0.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_template"]

[tool.ruff]
line-length = 120
fix = true
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "C90",  # mccabe complexity
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "UP",   # pyupgrade
    "PLC0415",  # import outside toplevel
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and may hardcode test-only values; both are safe here.
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
# -W error: treat warnings (incl. deprecations) as failures.
# --strict-markers / --strict-config: fail on unknown markers or config typos.
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=100 -W error --strict-markers --strict-config"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
# Mirror requires-python; keeps type checks aligned with the runtime target.
python-version = "3.14"

[tool.coverage.report]
# Exclude conventionally un-testable lines from the coverage gate.
exclude_also = [
    'if __name__ == .__main__.:',
]
